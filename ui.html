*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}

.num{font-variant-numeric:tabular-nums}

.err{color:var(--color-error)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* 动效：只回应操作和状态变化，页面不会自己动 */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

@keyframes fade{from{opacity:0}}
@keyframes pulse{to{opacity:.45}}
@keyframes trickle{to{transform:scaleX(.92)}}
@keyframes mark{to{background-size:100% 100%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
#main{view-transition-name:main}
::view-transition-old(main){animation:vt-out 120ms ease-out both}
::view-transition-new(main){animation:vt-in 320ms var(--ease-out) both}
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--dur-short)}
#main{transition:opacity var(--dur-short)}
#main.busy{opacity:.5}
.load{position:fixed;top:0;left:var(--side-w);right:0;z-index:var(--z-toast);height:2px;overflow:hidden;opacity:0;pointer-events:none;transition:opacity var(--dur-short)}
.load.on{opacity:1}
/* 加载线：先快后慢地往前走，好了就走完、淡出 */
.load i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--color-accent-fill);transform:scaleX(0);transform-origin:left}
.load.on i,.boot .load i{animation:trickle 6s cubic-bezier(.05,.7,.1,1) forwards}
.load.fin i{transform:none;transition:transform var(--dur-micro) ease-out}
.boot{display:grid;place-content:center;justify-items:center;gap:var(--space-lg);min-height:72vh}
.boot .brand{margin:0;font-size:2.6rem;animation:rise var(--dur-long) var(--ease-out) both}
.boot .load{position:static;width:7rem;opacity:1;border-radius:var(--radius-pill);background:var(--color-paper-3);animation:fade var(--dur-long) var(--dur-short) both}

/* 控件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);height:32px;padding:0 var(--space-md);border:0;border-radius:var(--radius-pill);background:var(--color-paper-3);color:var(--color-ink);font-size:var(--text-sm);font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer;transition:background-color var(--dur-micro),color var(--dur-micro),transform var(--dur-micro) var(--ease-out)}
.btn:hover{background:var(--color-paper-4)}
.btn:active{transform:scale(.96)}

.btn.primary:hover{background:var(--color-accent-fill-2)}
.btn.lg{height:40px;padding:0 var(--space-lg);font-size:var(--text-md)}
.btn.quiet{background:transparent;color:var(--color-ink-2);padding:0 var(--space-sm)}

.btn.icon{width:32px;padding:0}
.btn.block{width:100%}
.btn[aria-pressed=true]{background:var(--color-accent-soft);color:var(--color-accent)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed;transform:none}

.in{width:100%;height:40px;border:1px solid var(--color-field);border-radius:var(--radius-ctl);background:var(--color-raised);padding:0 var(--space-sm);transition:border-color var(--dur-micro)}
input.in,textarea.in{-webkit-appearance:none;appearance:none}
.in::placeholder{color:var(--color-muted)}
.in:hover{border-color:var(--color-ink-2)}
.in:focus-visible{outline:2px solid var(--color-focus);outline-offset:-1px}
.in:disabled{opacity:.55;cursor:not-allowed}
.in.sm{height:32px;font-size:var(--text-sm)}
textarea.in{height:auto;min-height:6.4rem;padding:var(--space-xs) var(--space-sm);line-height:1.5;resize:vertical}
select.in{width:auto;padding-right:var(--space-xl);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}

.search{position:relative}

.search .in{padding-left:var(--space-xl)}

.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg-thumb{display:none;position:absolute;top:var(--space-3xs);bottom:var(--space-3xs);left:0;border-radius:var(--radius-pill);background:var(--color-thumb);box-shadow:var(--shadow-thumb);transform-origin:left}

.seg.moving button[aria-pressed=true]::before{opacity:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs)}
.grow{flex:1;min-width:0}

/* 阅读 */
.rbar{position:sticky;top:0;z-index:var(--z-sticky);display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);min-height:var(--bar-h);padding:var(--space-xs) var(--space-xl);background:var(--color-glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}

.doc{font-family:var(--font-read);font-size:var(--read-size);line-height:1.8;color:var(--color-ink-2);min-width:0}
/* 标题和加粗用黑体：Mac 上宋体调不出粗体，中文会比旁边的英文细一截 */

    h("td", {class: "c"}, h("input", {type: "checkbox", checked: S_.has(it.sid), "aria-label": `让 AI 写 ${it.sid}`, onchange: e => { e.target.checked ? S_.add(it.sid) : S_.delete(it.sid); pick(); }})),
    h("td", {class: "id num"}, it.sid),
    h("td", {}, h("a", {class: "ti", title: it.title, href: `#/read/${E(id)}/${it.sid}/${it.has_review ? "review" : "raw"}`}, it.title), h("span", {class: "ms"}, `${it.kind}，${it.method}`)),
    h("td", {class: "len num"}, it.length),
    cell(it, "review", it.has_review), cell(it, "guide", it.has_guide),
    h("td", {class: "d r"}, h("a", {class: "quiet-a", href: `#/read/${E(id)}/${it.sid}/raw`}, "看原文")))),
    rows.length ? null : h("tr", {}, h("td", {colspan: 7, class: "hint empty"}, "没有叫这个名字的材料。")));
  const all = document.getElementById("matall");
  all.checked = S_.size === p.items.length; all.indeterminate = S_.size > 0 && S_.size < p.items.length;
}

/* ---------- 阅读 ---------- */
const TABS = [["raw", "原文"], ["review", "复习文档"], ["guide", "精读指引"]];
const tsOf = a => { const m = /[?&]t=(\d+)/.exec(a.getAttribute("href") || ""); if (m) return +m[1];
  const s = a.textContent.trim().split(":").map(Number); return s.some(isNaN) ? null : s.reduce((x, y) => x * 60 + y, 0); };
const vidOf = u => { const m = /[?&]v=([\w-]{6,})/.exec(u || "") || /youtu\.be\/([\w-]{6,})/.exec(u || ""); return m ? m[1] : null; };
const isTs = a => /^\d{1,2}:\d{2}(:\d{2})?$/.test(a.textContent.trim());
function dress(doc){   // 时间戳、表格、公式
  doc.querySelectorAll("a").forEach(a => { if (isTs(a)){ a.classList.add("ts"); a.classList.add("num"); } });
  doc.querySelectorAll("table").forEach(t => { const w = h("div", {class: "tw"}); t.replaceWith(w); w.append(t); });
  const typeset = () => doc.querySelectorAll(".math").forEach(m => { if (m.dataset.done) return; m.dataset.done = 1;
    try { window.katex.render(m.textContent, m, {displayMode: m.classList.contains("math-d"), throwOnError: false}); } catch {} });
  if (window.katex) typeset(); else window.addEventListener("load", typeset, {once: true});
}
async function loadRaw(p, it){
  const key = p.id + "/" + it.sid;
  if (!rawCache[key]){
    const d = await getDoc(p.id, p.sections.raw + "/" + it.file);
    const box = h("div", {html: d.html});
    rawCache[key] = [...box.querySelectorAll("p")].map(el => { const a = el.firstElementChild; const t = a && a.tagName === "A" && el.firstChild === a && isTs(a) ? tsOf(a) : null; return t == null ? null : {t, html: el.innerHTML}; }).filter(Boolean);
  }
  return rawCache[key];
}
const nearest = (paras, sec) => { let k = 0; paras.forEach((x, i) => { if (x.t <= sec + 1) k = i; }); return k; };
async function viewRead(r){
  const tok = navToken, id = r.id;
  let p = packCache[id];
  if (!p){ if (!$main.firstChild) put($main, skeleton()); else loading(true); }
  try {
    if (!p){ p = packCache[id] = await getPack(id); if (tok !== navToken) return; }
    renderSide();
    let path, it = null, idx = -1, tab = null;
    if (r.view === "read"){
      idx = p.items.findIndex(i => i.sid === r.a); it = p.items[idx]; tab = TABS.some(t => t[0] === r.tab) ? r.tab : "raw";
      if (!it) throw new Error("找不到这份材料。");
      path = `${p.sections[tab]}/${it.file}`;
    } else path = r.rest;
    const have = !it || tab === "raw" || it["has_" + tab];
    const key = id + "/" + path;
    let d = have ? docCache.get(key) || null : null;
    if (have && d) getDoc(id, path, true).then(f => { if (tok === navToken && f.text !== d.text) viewRead(r); }).catch(() => {});   // 先给内存里的，后台核对有没有改过
    else if (have){ if ($main.firstChild && !$main.querySelector("[aria-busy]")) loading(true); d = await getDoc(id, path).catch(() => null); if (tok !== navToken) return; }
    viewRead.shown = {id, sid: it?.sid, tab, have: !!d, sig: JSON.stringify(it)};
    const nav = (i, ic, label) => { const o = p.items[i]; if (!o) return btn("", ic, {class: "btn icon", disabled: true, "aria-label": label});
      const t = tab !== "raw" && !o["has_" + tab] ? "raw" : tab;
      return h("a", {class: "btn icon", href: `#/read/${E(id)}/${o.sid}/${t}`, title: `${label}：${o.sid} ${o.title}（键盘 ${ic === "left" ? "←" : "→"}）`, "aria-label": label}, icon(ic)); };
    const bar = h("div", {class: "rbar"},
      it ? seg("tabs", "看哪一份", TABS.map(([k, t]) => [k, t, {disabled: k !== "raw" && !it["has_" + k], title: k !== "raw" && !it["has_" + k] ? "还没写" : null}]), tab,
        k => { if (k !== tab) location.hash = `#/read/${E(id)}/${it.sid}/${k}`; })
        : h("span", {class: "name"}, d ? d.title : "打不开这一页"),
      it ? h("span", {class: "row tight"}, nav(idx - 1, "left", "上一份"), h("span", {class: "pos num"}, `${it.sid} / ${p.items.length}`), nav(idx + 1, "right", "下一份")) : null,
      h("span", {class: "grow"}),
      d ? btn("显示", "text", {class: "btn quiet", onclick: e => displayPop(e.currentTarget, true)}) : null,
      d ? btn("复制全文", "copy", {class: "btn quiet", onclick: e => copy(d.text, "全文已复制", e.currentTarget)}) : null,
      d ? btn("打印", "print", {class: "btn quiet", title: "打印，或存为 PDF", onclick: () => window.print()}) : null);
    if (!d){
      show([bar, h("div", {class: "blank"}, h("h2", {}, it ? `${it.sid} 的${TABS.find(t => t[0] === tab)[1]}还没写` : "这一页打不开"),
        h("p", {}, it ? "回到复习包，把「给 AI 的话」交给你的 AI。它写好以后，这一页会自己出现。" : "文件可能已经被移动或删除。"),
        h("a", {class: "btn primary lg", href: "#/pack/" + E(id)}, "回到复习包"))], () => window.scrollTo(0, 0));
      return;
    }
    const doc = h("article", {class: "doc" + (tab === "raw" ? " raw" : ""), html: d.html});
    dress(doc);
    if (tab === "raw") doc.querySelectorAll("p").forEach(el => { const a = el.firstElementChild; if (a && a.classList.contains("ts") && el.firstChild === a){ el.classList.add("tsp"); el.dataset.t = tsOf(a); } });
    const heads = [...doc.querySelectorAll("h2, h3")];
    heads.forEach((el, i) => { el.id = "sec" + i; });
    const links = heads.map(el => h("a", {href: "#", title: el.textContent, class: el.tagName === "H3" ? "l3" : "", onclick: e => { e.preventDefault(); el.scrollIntoView({behavior: "smooth"}); }}, el.textContent));
    const toc = heads.length > 2 ? h("nav", {class: "toc", "aria-label": "本页目录"}, h("p", {class: "k"}, "本页目录"), links) : null;
    const rail = h("aside", {class: "rail", id: "rail"}, toc);
    const closePeek = () => { rail.classList.remove("peeking"); put(rail, toc); doc.querySelectorAll("a.ts.on").forEach(a => a.classList.remove("on")); };
    const peek = async (o, sec, href, a) => {
      doc.querySelectorAll("a.ts.on").forEach(x => x.classList.remove("on")); a.classList.add("on");
      const body = h("div", {class: "peek-b"}, h("p", {class: "hint"}, "正在找这一段"));
      rail.classList.add("peeking");
      put(rail, h("div", {class: "peek-h"}, h("h2", {class: "grow"}, `${o.sid} 原文，${fmtTs(sec)}`), btn("", "x", {class: "btn quiet icon", "aria-label": "关掉对照", onclick: closePeek})), body,
        h("div", {class: "peek-f"}, h("a", {class: "btn", href, target: "_blank", rel: "noopener"}, icon("play"), "看视频这一段"),
          h("a", {class: "btn quiet", href: `#/read/${E(id)}/${o.sid}/raw/${sec}`}, "打开完整原文")));
      try {
        const paras = await loadRaw(p, o); if (!a.classList.contains("on")) return;
        if (!paras.length) throw new Error();
        const k = nearest(paras, sec);
        put(body, paras.slice(Math.max(0, k - 1), k + 3).map((x, i) => h("p", {class: i + Math.max(0, k - 1) === k ? "hit" : "", html: x.html})));
        body.querySelectorAll("a").forEach(x => { x.target = "_blank"; x.rel = "noopener"; });
        const hitEl = body.querySelector(".hit"); if (hitEl) body.scrollTop = Math.max(0, hitEl.offsetTop - body.offsetTop - 72);
      } catch { put(body, h("p", {class: "hint"}, "没找到这一段的原文，直接看视频吧。")); }
    };
    if (tab !== "raw") doc.addEventListener("click", e => {   // 点出处：右边对照原文；按住 ⌘ 点直接开视频
      const a = e.target.closest("a.ts"); if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
      const v = vidOf(a.href), o = v && p.items.find(i => vidOf(i.source) === v), sec = tsOf(a);
      if (!o || sec == null) return;
      e.preventDefault(); peek(o, sec, a.href, a);
    });
    if (it) store("wg_last", {id, sid: it.sid, tab});
    show([bar, h("div", {class: "rwrap"}, doc, rail)], () => {
      const hit = r.at != null && tab === "raw" ? [...doc.querySelectorAll("p.tsp")].filter(el => +el.dataset.t <= +r.at + 1).pop() : null;
      if (hit){ hit.classList.add("cited"); hit.scrollIntoView({block: "center"}); }
      else if (pos[key] > 200){ window.scrollTo(0, pos[key]); toast("回到上次读到的地方"); }
      else window.scrollTo(0, 0);
      let tick = 0;
      const onScroll = () => { if (tick) return; tick = requestAnimationFrame(() => { tick = 0;
        let cur = -1; heads.forEach((el, i) => { if (el.getBoundingClientRect().top < 140) cur = i; });
        links.forEach((l, i) => l.setAttribute("aria-current", String(i === cur)));
        const room = document.documentElement.scrollHeight - innerHeight;   // 顶栏底下那条线：这一份读到哪了
        bar.classList.toggle("stuck", scrollY > 4); bar.style.setProperty("--read", room > 200 ? Math.min(1, scrollY / room).toFixed(4) : 0);
        pos[key] = Math.round(scrollY); clearTimeout(onScroll.t); onScroll.t = setTimeout(() => { const ks = Object.keys(pos); if (ks.length > 120) delete pos[ks[0]]; store("wg_pos", pos); }, 500); }); };
      window.addEventListener("scroll", onScroll, {passive: true}); onScroll();
      readCleanup = () => { window.removeEventListener("scroll", onScroll); cancelAnimationFrame(tick); clearTimeout(onScroll.t); store("wg_pos", pos); };
      warm(p, Math.max(0, idx), tab || "review");
    });
  } catch (e) {
    if (tok === navToken) show([h("div", {class: "page"}, h("div", {class: "blank"}, h("h2", {}, "打不开这一页"), h("p", {}, e.message), h("a", {class: "btn", href: "#/pack/" + E(id)}, "回到复习包")))]);
  }
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ if (popEl) closePop(); else if (document.querySelector(".rail.peeking")) document.querySelector(".rail .btn.icon")?.click(); else $side.classList.remove("open"); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.querySelector("dialog[open]")) return;
  const r = route(); if (r.view !== "read") return;
  const p = packCache[r.id]; if (!p) return;
  const tab = TABS.some(t => t[0] === r.tab) ? r.tab : "raw";
  const i = p.items.findIndex(x => x.sid === r.a), o = p.items[i + (e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0)];
  if (o && o !== p.items[i]){ const t = tab !== "raw" && !o["has_" + tab] ? "raw" : tab; location.hash = `#/read/${E(r.id)}/${o.sid}/${t}`; }
});

/* ---------- 路由与轮询 ---------- */
function goHome(){
  const last = load("wg_last", null), live = S.packs.filter(p => !p.archived);
  const tgt = live.find(p => p.id === last?.id) || live[0];
  location.replace(tgt ? "#/pack/" + E(tgt.id) : "#/new");
}
function render(){
  navToken++; closePop(); editing = false; loading(false);
  if (readCleanup){ readCleanup(); readCleanup = null; }
  const r = route();
  if (stale){ renderSide(); show([h("div", {class: "page narrow"}, h("div", {class: "blank"}, h("h2", {}, "温故更新过了，要重新打开一次"),
    h("p", {}, "页面已经是新的，正在运行的还是更新前启动的那一次。先退出，再双击「温故」打开，复习包都还在。"), btn("退出温故", "power", {class: "btn primary lg", onclick: quit})))]); return; }
  if (r.view !== "read" && r.view !== "doc") viewRead.shown = null;
  renderSide();
  if (r.view === "pack") viewPack(r.id);
  else if (r.view === "read" || r.view === "doc") viewRead(r);
  else if (r.view === "new") viewNew();
  else if (booted) goHome(); else if (!$main.firstChild) put($main, boot());
}
async function poll(){
  if (pollTimer === "stopped") return;
  clearTimeout(pollTimer);
  const tok = navToken, r = route();
  try {
    S = await api("/api/state"); online = true;
    const first = !booted, was = stale; booted = true; stale = !!S.version && S.version !== WANT;
    if (stale !== was){ render(); }
    if (stale) throw 0;
    const j = S.job, fresh = j && j.status === "done" && j.pack && prefs.jobSeen !== j.id;
    if (fresh){ prefs.jobSeen = j.id; sessionStorage.setItem("wg_job", j.id); }
    if (r.view === "" && tok === navToken){ goHome(); if (first) renderSide(); }
    else if (fresh && r.view === "new") location.hash = "#/pack/" + E(j.pack);   // 提取刚完成：直接进复习包
    else {
      renderSide();
      if (tok === navToken && r.view === "new") paintNew();
      if (tok === navToken && r.view === "pack"){
        const p = await getPack(r.id);
        if (tok === navToken && JSON.stringify(p) !== viewPack.last){ viewPack.last = JSON.stringify(p); packCache[r.id] = p; paintPack(p); }
      }
      if (tok === navToken && (r.view === "read" || r.view === "doc") && packCache[r.id]){   // AI 刚写好的文档：目录和当前页自己更新
        const p = await getPack(r.id), sh = viewRead.shown;
        if (tok === navToken){ packCache[r.id] = p; renderSide();
          const now = sh && sh.sid && p.items.find(i => i.sid === sh.sid);
          if (now && JSON.stringify(now) !== sh.sig) viewRead(r); }
      }
    }
  } catch (e) { if (e !== 0) online = false; }
  let nb = document.getElementById("net");
  if (online) nb?.remove();
  else if (!nb) document.body.append(h("p", {class: "banner net", id: "net", role: "alert"}, "连不上温故，它可能已经退出了。双击「温故」重新打开，这个页面会自己恢复。"));
  if (pollTimer !== "stopped") pollTimer = setTimeout(poll, S.job?.status === "running" ? 1200 : 4000);
}
window.addEventListener("hashchange", render);
applyPrefs(); setupSide(); render(); poll();
