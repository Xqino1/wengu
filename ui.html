:root[data-face=sans]{--font-read:var(--font-body)}
@property --hw{syntax:"<percentage>";inherits:false;initial-value:0%}
@property --ha{syntax:"<percentage>";inherits:false;initial-value:100%}

*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
html{font-size:15px;-webkit-text-size-adjust:100%;scrollbar-color:var(--color-rule-2) transparent;scroll-padding-top:var(--space-3xl)}
body{margin:0;background:var(--color-desk);color:var(--color-ink);font-family:var(--font-body);font-size:var(--text-md);line-height:1.55;-webkit-font-smoothing:antialiased;caret-color:var(--color-accent-fill)}
::selection{background:var(--color-select);color:var(--color-ink)}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--color-accent);text-decoration-color:var(--color-rule-2);text-decoration-thickness:1px;text-underline-offset:.22em;transition:text-decoration-color var(--dur-micro)}
a:hover{text-decoration-color:currentColor}
h1,h2,h3{margin:0;overflow-wrap:break-word;min-width:0;text-wrap:balance}
h1{font-size:var(--text-xl);line-height:1.2;font-weight:500;letter-spacing:-.01em}
h2{font-size:var(--text-lg);line-height:1.35;font-weight:500}
p{margin:0}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.hint{color:var(--color-muted);font-size:var(--text-sm)}
.err{color:var(--color-error)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* 动效：只回应操作和状态变化，页面不会自己动 */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{to{opacity:.45}}
@keyframes trickle{to{transform:scaleX(.92)}}
@keyframes mark{to{background-size:100% 100%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
#main{view-transition-name:main}
::view-transition-old(main){animation:vt-out 120ms var(--ease-out) both}
::view-transition-new(main){animation:vt-in 320ms var(--ease-out) both}
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--dur-short)}
#main{transition:opacity var(--dur-short)}
#main.busy{opacity:.5}
.load{position:fixed;top:0;left:var(--side-w);right:0;z-index:var(--z-toast);height:2px;overflow:hidden;opacity:0;pointer-events:none;transition:opacity var(--dur-short)}
.load.on{opacity:1}
/* 加载线：先快后慢地往前走，好了就走完、淡出 */
.load i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--color-accent-fill);transform:scaleX(0);transform-origin:left}
.load.on i{animation:trickle 6s cubic-bezier(.05,.7,.1,1) forwards}
.load.fin i{transform:none;transition:transform var(--dur-micro) var(--ease-out)}

/* 控件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);height:32px;padding:0 var(--space-md);border:0;border-radius:var(--radius-item);background:var(--color-paper-3);color:var(--color-ink);font-size:var(--text-sm);font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer;transition:background-color var(--dur-micro),color var(--dur-micro),transform var(--dur-micro) var(--ease-out)}
.btn:hover{background:var(--color-paper-4)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--color-accent-fill);color:var(--color-fill-ink)}
.btn.primary:hover{background:var(--color-accent-fill-2)}
.btn.lg{height:40px;padding:0 var(--space-lg);font-size:var(--text-md)}
.btn.quiet{background:transparent;color:var(--color-ink-2);padding:0 var(--space-sm)}
.btn.quiet:hover{background:var(--color-paper-3);color:var(--color-ink)}
.btn.icon{width:32px;padding:0}
.btn.block{width:100%}
.btn[aria-pressed=true]{background:var(--color-accent-soft);color:var(--color-accent)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed;transform:none}
.btn.done{color:var(--color-success)}
.btn.primary.done{color:var(--color-fill-ink)}
.btn.done svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw var(--dur-short) 60ms var(--ease-out) forwards}
.in{width:100%;height:40px;border:1px solid var(--color-field);border-radius:var(--radius-ctl);background:var(--color-raised);padding:0 var(--space-sm);transition:border-color var(--dur-micro)}
input.in,textarea.in{-webkit-appearance:none;appearance:none}
.in::placeholder{color:var(--color-muted)}
.in:hover{border-color:var(--color-ink-2)}
.in:focus-visible{outline:2px solid var(--color-focus);outline-offset:-1px}
.in:disabled{opacity:.55;cursor:not-allowed}
.in.sm{height:32px;font-size:var(--text-sm)}
textarea.in{height:auto;min-height:6.4rem;padding:var(--space-xs) var(--space-sm);line-height:1.5;resize:vertical}
select.in{width:auto;padding-right:var(--space-xl);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--color-accent-fill);vertical-align:-2px}
label.f{display:block;font-weight:500;font-size:var(--text-sm);margin:var(--space-lg) 0 var(--space-xs)}
label.f small{font-weight:400;font-size:inherit;color:var(--color-muted)}
.search{position:relative}
.search svg{position:absolute;left:var(--space-xs);top:50%;transform:translateY(-50%);color:var(--color-muted);pointer-events:none}
.search .in{padding-left:var(--space-xl)}
/* 分段开关：选中的那一块会滑过去 */
.seg{position:relative;display:inline-flex;border-radius:var(--radius-ctl);background:var(--color-paper-3)}
.seg button{position:relative;z-index:1;height:32px;padding:0 var(--space-md);border:0;border-radius:var(--radius-item);background:none;color:var(--color-ink-2);font-size:var(--text-sm);font-weight:500;white-space:nowrap;cursor:pointer;transition:color var(--dur-micro)}
.seg button::before{content:"";position:absolute;inset:var(--space-3xs);z-index:-1;border-radius:var(--radius-item);background:var(--color-thumb);box-shadow:var(--shadow-thumb);opacity:0}
.seg button:hover{color:var(--color-ink)}
.seg button[aria-pressed=true]{color:var(--color-ink)}
.seg button[aria-pressed=true]::before{opacity:1}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg-thumb{display:none;position:absolute;top:var(--space-3xs);bottom:var(--space-3xs);left:0;border-radius:var(--radius-item);background:var(--color-thumb);box-shadow:var(--shadow-thumb);transform-origin:left}
.seg.moving .seg-thumb{display:block}
.seg.moving button[aria-pressed=true]::before{opacity:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs)}
.grow{flex:1;min-width:0}
.row.tight{gap:var(--space-3xs)}
.mid{text-align:center}
.hint.under{min-height:1lh;margin-top:var(--space-2xs)}
label.f.tight{margin-top:var(--space-xs)}
.go.tight{margin-top:var(--space-md)}
table.mat td.empty{padding:var(--space-lg) var(--space-xs)}
.spin{width:14px;height:14px;flex:none;border:2px solid var(--color-rule-2);border-top-color:var(--color-accent-fill);border-radius:50%;animation:spin .8s linear infinite}
.bar{height:6px;border-radius:var(--radius-pill);background:var(--color-paper-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--color-accent-fill);transform:scaleX(var(--p,0));transform-origin:left;transition:transform var(--dur-long) var(--ease-out)}
.sk{height:14px;border-radius:var(--radius-tag);background:var(--color-paper-3);margin-bottom:var(--space-sm);animation:pulse .9s ease-in-out infinite alternate}
.sk.t{height:28px;width:46%;margin-bottom:var(--space-lg)}

/* 外壳：三层。最底下是桌面（左栏直接放在桌面上），内容是摊在桌面上的一张纸，工具条和弹出的东西浮在纸上面 */
.shell{padding-left:var(--side-w);min-height:100vh;min-height:100dvh}
.side{position:fixed;left:0;top:0;bottom:0;z-index:var(--z-side);width:var(--side-w);display:flex;flex-direction:column}
.side-top{padding:var(--space-md) var(--space-sm) var(--space-xs)}
.brand{display:inline-block;margin:0 var(--space-2xs) var(--space-sm);font-family:var(--font-display);font-size:1.5rem;font-weight:500;line-height:1;letter-spacing:.12em;color:var(--color-ink);text-decoration:none}
.side-head{display:grid;gap:var(--space-xs)}
.side-head .btn{background:var(--color-raised);box-shadow:var(--shadow-thumb)}
.side-head .btn:hover{background:var(--color-sheet)}
.back{display:flex;align-items:center;gap:var(--space-2xs);padding:var(--space-xs) var(--space-2xs);border-radius:var(--radius-item);color:var(--color-ink);font-weight:500;line-height:1.35;text-decoration:none;transition:background-color var(--dur-micro)}
.back:hover{background:var(--color-desk-hover)}
.back svg{transition:transform var(--dur-micro) var(--ease-out)}
.back:hover svg{transform:translateX(-2px)}
.back span{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.lib{flex:1;overflow:auto;padding:0 var(--space-xs) var(--space-sm);scrollbar-width:thin}
.grp{display:flex;align-items:center;gap:var(--space-2xs);width:100%;padding:var(--space-md) var(--space-xs) var(--space-2xs);border:0;background:none;color:var(--color-muted);font-size:var(--text-xs);font-weight:500;text-align:left;cursor:pointer;transition:color var(--dur-micro)}
.grp:hover{color:var(--color-ink)}
.grp svg{width:12px;height:12px;transition:transform var(--dur-short) var(--ease-out)}
.grp[aria-expanded=false] svg{transform:rotate(-90deg)}
.grp .n{margin-left:auto;font-weight:400}
p.grp{margin:0;cursor:default}
p.grp:hover{color:var(--color-muted)}
.pk{display:block;padding:var(--space-xs);border-radius:var(--radius-item);color:var(--color-ink);text-decoration:none;transition:background-color var(--dur-micro),transform var(--dur-micro) var(--ease-out)}
.pk:hover{background:var(--color-desk-hover)}
.pk:active{transform:scale(.985)}
.pk[aria-current=page]{background:var(--color-sheet);box-shadow:var(--shadow-thumb)}
.pk-t{display:flex;align-items:center;gap:var(--space-2xs);font-size:var(--text-sm);font-weight:500;line-height:1.4}
.pk-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-t svg{width:12px;height:12px;color:var(--color-muted);fill:currentColor}
.pk-s{display:block;margin-top:var(--space-3xs);color:var(--color-muted);font-size:var(--text-xs)}
.pk:hover .pk-s,.pk[aria-current=page] .pk-s{color:var(--color-ink-2)}
.lec{display:grid;grid-template-columns:2.4rem minmax(0,1fr) 14px;align-items:center;gap:var(--space-2xs);min-height:32px;padding:var(--space-2xs) var(--space-xs);border-radius:var(--radius-item);color:var(--color-ink-2);font-size:var(--text-sm);line-height:1.5;text-decoration:none;transition:background-color var(--dur-micro),color var(--dur-micro)}
.lec:hover{background:var(--color-desk-hover);color:var(--color-ink)}
.lec:active{opacity:.8}
.lec[aria-current=page]{background:var(--color-sheet);box-shadow:var(--shadow-thumb);color:var(--color-ink);font-weight:500}
.lec .id{color:var(--color-muted);font-weight:400}
.lec:hover .id,.lec[aria-current=page] .id{color:var(--color-ink-2)}
.lec .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lec svg{width:14px;height:14px;align-self:center;color:var(--color-success)}
.lec.x{grid-template-columns:minmax(0,1fr)}
.lib-empty{padding:var(--space-md) var(--space-xs);color:var(--color-muted);font-size:var(--text-sm)}
.side-foot{display:flex;justify-content:space-between;gap:var(--space-2xs);padding:var(--space-xs)}
.side-foot .btn.quiet:hover{background:var(--color-desk-hover)}
.mbar{display:none}
.main{position:relative;min-width:0;min-height:calc(100dvh - 2 * var(--space-xs));margin:var(--space-xs) var(--space-xs) var(--space-xs) 0;border-radius:var(--radius-box);background:var(--color-paper);box-shadow:var(--shadow-sheet)}
body[data-view=start] .side,body[data-view=start] .mbar,body[data-view=library] .side,body[data-view=library] .mbar{display:none}
body[data-view=start] .shell,body[data-view=library] .shell{padding-left:0}
body[data-view=start] .main,body[data-view=library] .main{min-height:100dvh;margin:0;border-radius:0;background:none;box-shadow:none}
body[data-view=start] .load,body[data-view=library] .load{left:0}
body[data-view=start]{overflow:hidden;background:var(--color-paper)}
.page{max-width:63rem;margin-inline:auto;padding:var(--space-2xl) var(--space-xl) var(--space-3xl)}
.page.narrow{max-width:44rem}
.lead{margin-top:var(--space-xs);color:var(--color-muted);font-size:var(--text-lg);line-height:1.5;max-width:40rem}

/* 新建 */
.drop{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-md);border:1px dashed var(--color-rule-2);border-radius:var(--radius-box);background:var(--color-paper-2);color:var(--color-muted);transition:background-color var(--dur-micro),border-color var(--dur-micro)}
.drop svg{width:20px;height:20px;color:var(--color-muted)}
.drop strong{color:var(--color-ink);font-weight:500}
.drop.over{border-color:var(--color-ink);border-style:solid;background:var(--color-paper-3);color:var(--color-ink)}
.drop .btn{background:var(--color-raised);box-shadow:var(--shadow-thumb)}
.files{list-style:none;margin:var(--space-xs) 0 0;padding:0}
.files li{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-2xs) 0 var(--space-2xs) var(--space-xs);border-bottom:1px solid var(--color-rule);animation:rise var(--dur-short) var(--ease-out)}
.files .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.files .sz{color:var(--color-muted);font-size:var(--text-sm)}
.go{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm);margin-top:var(--space-lg)}
.job{margin-bottom:var(--space-xl);padding:var(--space-md) var(--space-lg) var(--space-lg);border-radius:var(--radius-box);background:var(--color-paper-2)}
.job h2{margin-bottom:var(--space-sm)}
.job .hint{margin-top:var(--space-xs)}
.jitems{list-style:none;margin:var(--space-sm) 0 0;padding:0;max-height:19rem;overflow:auto;border-top:1px solid var(--color-rule);scrollbar-width:thin}
.jitems li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--space-3xs) var(--space-xs);align-items:center;padding:var(--space-xs) 0;border-bottom:1px solid var(--color-rule);font-size:var(--text-sm)}
.jitems .lb{overflow-wrap:anywhere}
.jitems .dt{grid-column:2;color:var(--color-muted);font-size:var(--text-xs)}
.jitems .ok svg{color:var(--color-success)}
.jitems .fail svg,.jitems .fail .dt{color:var(--color-error)}
.jitems .wait{color:var(--color-muted)}
.jitems .run .lb{font-weight:500}

/* 复习包 */
.pk-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--space-sm) var(--space-md)}
.pk-head>.grow{flex:1 1 18rem}
.pk-title{display:flex;align-items:center;gap:var(--space-2xs)}
.pk-title .btn{color:var(--color-muted);opacity:.6;transition:opacity var(--dur-micro),background-color var(--dur-micro),transform var(--dur-micro) var(--ease-out)}
.pk-title:hover .btn,.pk-title .btn:focus-visible{opacity:1}
.pk-title h1{font-family:var(--font-display);font-size:2.2rem;font-weight:400;line-height:1.25;letter-spacing:.02em}
.in.h1{height:52px;font-family:var(--font-display);font-size:2.2rem;letter-spacing:.02em;padding:0 var(--space-xs)}
.pk-sub{display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--space-xs);color:var(--color-muted);min-height:32px}
.link{display:inline-flex;align-items:center;min-height:32px;padding:0;border:0;background:none;white-space:nowrap;color:var(--color-accent);font-size:inherit;text-decoration:underline;text-decoration-color:var(--color-rule-2);text-decoration-thickness:1px;text-underline-offset:.22em;cursor:pointer;transition:text-decoration-color var(--dur-micro)}
.link:hover{text-decoration-color:currentColor}
.link:active{opacity:.7}
.pk-sub .in{width:14rem}
.banner{margin-top:var(--space-md);padding:var(--space-sm) var(--space-md);border-radius:var(--radius-box);background:var(--color-error-soft);color:var(--color-error)}
.banner ul{margin:var(--space-2xs) 0 0;padding-left:1.2em}
.ai{margin-top:var(--space-xl);padding:0 var(--space-lg);border-radius:var(--radius-box);background:var(--color-paper-2);box-shadow:inset 0 0 0 .5px var(--color-rule)}
.ai-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);padding:var(--space-md) 0}
.steps{list-style:none;counter-reset:st;margin:0;padding:0 0 var(--space-lg)}
.steps.enter>li{animation:rise var(--dur-long) var(--ease-out) both}
.steps.enter>li:nth-child(2){animation-delay:60ms}
.steps.enter>li:nth-child(3){animation-delay:120ms}
.steps>li{counter-increment:st;position:relative;padding:0 0 var(--space-lg) var(--space-xl)}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(st);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--color-ink);color:var(--color-paper);font-size:var(--text-xs);font-weight:500;line-height:22px;text-align:center;font-variant-numeric:tabular-nums}
.st-t{font-weight:500;margin-bottom:var(--space-xs)}
.opts{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:var(--space-xs) var(--space-md)}
.opts>span{color:var(--color-muted);font-size:var(--text-sm)}
.prompt-w{margin:0 0 var(--space-sm)}
.prompt-more{min-height:24px;margin-top:var(--space-2xs);color:var(--color-muted);font-size:var(--text-sm)}
.prompt{margin:0;padding:var(--space-sm) var(--space-md);border-radius:var(--radius-ctl);background:var(--color-sheet);box-shadow:var(--shadow-thumb);color:var(--color-ink-2);font-family:inherit;font-size:var(--text-sm);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:thin}
.mat-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);margin-top:var(--space-xl)}
.mat-bar .search{width:15rem}
.extras{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2xs) var(--space-md);margin-top:var(--space-xs);color:var(--color-muted);font-size:var(--text-sm)}
.extras a{text-decoration-color:var(--color-rule-2)}
.extras a:hover{text-decoration-color:currentColor}
table.mat{width:100%;margin-top:var(--space-sm);border-collapse:collapse;font-variant-numeric:tabular-nums}
table.mat th{font-variant-numeric:tabular-nums;padding:var(--space-xs);border-bottom:1px solid var(--color-rule-2);color:var(--color-muted);font-size:var(--text-xs);font-weight:500;text-align:left;white-space:nowrap}
table.mat td{padding:var(--space-sm) var(--space-xs);border-bottom:1px solid var(--color-rule);vertical-align:middle;transition:background-color var(--dur-micro)}
table.mat tbody tr:hover td{background:var(--color-paper-2)}
table.mat .c{width:32px}
table.mat .id{width:3rem;color:var(--color-muted)}
table.mat .len{font-variant-numeric:tabular-nums;width:4.4rem;color:var(--color-muted);font-size:var(--text-sm);text-align:right}
table.mat th.len{text-align:right}
table.mat .d{font-variant-numeric:tabular-nums;width:6rem;white-space:nowrap;font-size:var(--text-sm)}
table.mat a.ti{color:var(--color-ink);font-weight:500;text-decoration:none;overflow-wrap:anywhere}
table.mat a.ti:hover{text-decoration:underline;text-decoration-color:var(--color-rule-2)}
table.mat .ms{font-variant-numeric:tabular-nums;display:block;color:var(--color-muted);font-size:var(--text-xs)}
.have{display:inline-flex;align-items:center;gap:var(--space-2xs);color:var(--color-success);font-weight:500;text-decoration:none}
.have:hover{text-decoration:underline}
.have svg{width:14px;height:14px}
.none{color:var(--color-faint)}
.tl{display:flex;align-items:center;gap:var(--space-xs);max-width:26rem;margin-top:var(--space-2xs)}
.tl-track{position:relative;flex:1;height:16px}
.tl-track::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;border-radius:var(--radius-pill);background:var(--color-rule)}
.tl-track a{position:absolute;top:1px;width:4px;height:14px;margin-left:calc(-1 * var(--space-3xs));border-radius:2px;background:var(--color-hl);transition:transform var(--dur-micro) var(--ease-out)}
.tl-track a:hover{transform:scaleY(1.35)}
.tl-n{flex:none;color:var(--color-muted);font-size:var(--text-xs);font-variant-numeric:tabular-nums}
.quiet-a{color:var(--color-muted);text-decoration:none;transition:color var(--dur-micro)}
.quiet-a:hover{color:var(--color-accent);text-decoration:underline}
.blank{padding:var(--space-3xl) var(--space-md);text-align:center;color:var(--color-muted)}
.blank h2{margin-bottom:var(--space-xs);color:var(--color-ink);font-size:var(--text-xl);letter-spacing:-.01em}
.blank .btn{margin-top:var(--space-lg)}

/* 浮层 */
dialog{width:min(36rem,92vw);padding:0;border:0;border-radius:18px;background:var(--color-raised);color:var(--color-ink);box-shadow:var(--shadow-modal)}
dialog[open]{animation:pop var(--dur-short) var(--ease-out)}
dialog::backdrop{background:var(--color-scrim);animation:fade var(--dur-short) var(--ease-out)}
dialog form{padding:var(--space-lg)}
dialog textarea.in{min-height:14rem}
dialog select.in{width:100%}
dialog .go{justify-content:flex-end}
.pop{position:fixed;z-index:var(--z-pop);width:18.6rem;padding:var(--space-md);border-radius:var(--radius-box);background:var(--color-raised);box-shadow:var(--shadow-pop);transform-origin:top right;animation:pop var(--dur-short) var(--ease-out)}
.pop .k{margin:var(--space-sm) 0 var(--space-2xs);color:var(--color-muted);font-size:var(--text-xs)}
.pop .k:first-child{margin-top:0}
.pop .seg{display:flex}
.pop .seg button{flex:1;padding:0 var(--space-2xs)}
.toast{position:fixed;left:50%;bottom:var(--space-lg);z-index:var(--z-toast);padding:var(--space-xs) var(--space-md);border-radius:var(--radius-ctl);background:var(--color-toast);color:var(--color-toast-ink);font-size:var(--text-sm);font-weight:500;opacity:0;transform:translate(-50%,10px) scale(.96);pointer-events:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity var(--dur-short),transform var(--dur-short) var(--ease-out)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.act.on{pointer-events:auto}
.toast-act{margin-left:var(--space-sm);padding:0 0 0 var(--space-sm);border:0;border-left:1px solid currentColor;background:none;color:inherit;font:inherit;font-weight:500;cursor:pointer}
.toast-act:hover{text-decoration:underline}
.btn.danger{color:var(--color-error)}
.btn.danger:hover,.btn.warn:hover{background:var(--color-error-soft);color:var(--color-error)}
.btn.danger.sure{background:var(--color-error-soft);color:var(--color-error)}
.trash-list{margin-top:var(--space-lg);border-top:1px solid var(--color-rule)}
.trash-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);padding:var(--space-sm) 0;border-bottom:1px solid var(--color-rule)}
.trash-row .grow{min-width:12rem}
.trash-row .pk-s{margin-top:var(--space-3xs)}
.net{position:fixed;left:50%;bottom:var(--space-2xl);z-index:var(--z-toast);transform:translateX(-50%);width:max-content;max-width:92vw;margin:0}

/* 阅读 */
.edge{position:sticky;top:0;z-index:var(--z-sticky);height:0}
.edge::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--bar-h) + var(--space-lg));border-radius:var(--radius-box) var(--radius-box) 0 0;background:linear-gradient(var(--color-paper) 55%,transparent);pointer-events:none;opacity:0;transition:opacity var(--dur-short)}
.edge.on::before{opacity:1}
.rbar{position:sticky;top:var(--space-xs);z-index:var(--z-sticky);display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);min-height:var(--bar-h);margin:var(--space-xs) var(--space-xs) 0;padding:var(--space-xs) var(--space-md);border-radius:var(--radius-box);background:var(--color-glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);transition:box-shadow var(--dur-long) var(--ease-out)}
.rbar.stuck{box-shadow:var(--shadow-float)}
.rbar::after{content:"";position:absolute;left:var(--space-md);right:var(--space-md);bottom:0;height:2px;border-radius:var(--radius-pill);background:var(--color-accent-fill);transform:scaleX(var(--read,0));transform-origin:left;pointer-events:none}
.rbar .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .pos{color:var(--color-muted);font-size:var(--text-sm);min-width:4.4rem;text-align:center}
.rwrap{display:grid;grid-template-columns:minmax(0,46rem) 19rem;gap:var(--space-2xl);justify-content:center;padding:var(--space-xl) var(--space-xl) var(--space-3xl)}
.rail{position:sticky;top:calc(var(--bar-h) + var(--space-lg));align-self:start;max-height:calc(100vh - var(--bar-h) - var(--space-2xl));overflow:auto;font-size:var(--text-sm);scrollbar-width:thin}
.toc .k{margin-bottom:var(--space-xs);color:var(--color-muted);font-size:var(--text-xs);font-weight:500}
.toc a{display:block;padding:var(--space-2xs) var(--space-xs);border-radius:var(--radius-item);color:var(--color-muted);line-height:1.5;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color var(--dur-micro),background-color var(--dur-micro)}
.toc a.l3{padding-left:var(--space-lg)}
.toc a:hover{background:var(--color-paper-2);color:var(--color-ink)}
.toc a:active{opacity:.8}
.toc a[aria-current=true]{color:var(--color-ink);background:var(--color-paper-2)}
.rail.peeking{display:flex;flex-direction:column;height:calc(100vh - var(--bar-h) - var(--space-2xl));overflow:hidden}
.rail.peeking>*{animation:rise var(--dur-short) var(--ease-out) both}
.peek-h{display:flex;align-items:center;gap:var(--space-xs);margin-bottom:var(--space-sm)}
.peek-h h2{font-size:var(--text-md);letter-spacing:0}
.peek-b{flex:1;min-height:0;overflow:auto;padding:0 var(--space-xs);font-family:var(--font-read);font-size:var(--text-md);line-height:1.7;color:var(--color-ink-2);scrollbar-width:thin}
.peek-b p{margin-bottom:var(--space-sm)}
.peek-b p.hit,.doc.raw p.cited{margin-inline:calc(-1 * var(--space-xs));padding:var(--space-2xs) var(--space-xs);border-radius:var(--radius-item);background:linear-gradient(var(--color-hl-soft),var(--color-hl-soft)) no-repeat left / 0% 100%;color:var(--color-ink);animation:mark 520ms 160ms var(--ease-out) forwards}

.doc{font-family:var(--font-read);font-size:var(--read-size);line-height:1.8;color:var(--color-ink-2);min-width:0}
/* 标题和加粗用黑体：Mac 上宋体调不出粗体，中文会比旁边的英文细一截 */
.doc h1,.doc h2,.doc h3,.doc h4{font-family:var(--font-body);color:var(--color-ink);font-weight:500;scroll-margin-top:calc(var(--bar-h) + var(--space-md))}

/* 出处：荧光笔划一道，指上去涂满 */
.doc a.ts{position:relative;isolation:isolate;padding:0 var(--space-3xs);color:var(--color-ink);font-family:var(--font-body);font-size:.82em;font-weight:500;font-variant-numeric:tabular-nums;text-decoration:none;white-space:nowrap}

.doc.raw p.cited>a.ts{right:calc(100% + var(--space-md) - var(--space-xs));color:var(--color-ink)}

/* 开始页：背景是你自己讲稿里的句子，分远、中、近三层往上飘。近的字大、颜色深、走得快、跟鼠标挪得多。
 * 滚轮或手指上下划，句子跟着快进或倒回；指到中层和近层的句子，荧光笔划一道；点一下回到讲课里的那一刻 */
.start{position:relative;height:100vh;height:100dvh;overflow:hidden;background:var(--color-paper);touch-action:none;user-select:none;-webkit-user-select:none}
.field{position:absolute;inset:0;overflow:hidden}

.layer .ln{position:absolute;color:var(--color-ink);font-family:var(--font-read);line-height:1.35;text-decoration:none;text-wrap:pretty;transition:opacity 900ms ease}
.layer .by{display:block;margin-top:.4em;font-family:var(--font-body);font-size:max(9px,.58em);letter-spacing:.02em;text-align:right;text-wrap:balance}
.layer .tx{-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:2px;background:linear-gradient(color-mix(in srgb,var(--color-hl) var(--ha),transparent),color-mix(in srgb,var(--color-hl) var(--ha),transparent)) no-repeat 0 88% / var(--hw) 46%}
.layer.l-far{filter:blur(.9px)}
.layer.l-mid{filter:blur(.3px)}
.layer.l-far .ln{font-size:13px;opacity:.13;pointer-events:none}
.layer.l-mid .ln{font-size:17px;opacity:.24}
.layer.l-near .ln{font-size:25px;letter-spacing:-.005em;opacity:.42}
.layer a.ln{cursor:pointer}
.layer .ln.lit:not(.dim){opacity:1;transition-duration:240ms}
.layer .ln.lit .tx{--hw:100%;transition:--hw 520ms var(--ease-out)}
.layer .ln.lit.dim .tx{--ha:0%;transition:--ha 1400ms ease}
.calm{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 36rem 22rem at 50% 50%,var(--color-paper) 46%,transparent 100%),
  linear-gradient(var(--color-paper),transparent 14%,transparent 82%,var(--color-paper))}
.cover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;padding:var(--space-lg);text-align:center;pointer-events:none}
.cover>*{pointer-events:auto}
.mark{position:relative;margin:0;padding:.28em .5em;font-family:var(--font-display);font-size:clamp(4.2rem,9vw,7.4rem);font-weight:400;line-height:1;letter-spacing:.16em;color:var(--color-ink)}
.mark svg{position:absolute;width:.42em;height:.42em;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square}
.mark svg.l{left:0;top:0}
.mark svg.r{right:0;bottom:0}
.mk-t{position:relative;display:inline-block;padding-left:.16em;isolation:isolate}

.mk-hl{position:absolute;z-index:-1;left:-.06em;right:.02em;bottom:.04em;height:.36em;background:var(--color-hl);transform:skewX(-14deg);transform-origin:left}

.cover-more .spin{width:12px;height:12px}

@keyframes st-field{from{opacity:0;transform:scale(1.07)}}
@keyframes st-ch{from{opacity:0;transform:translateY(.14em);filter:blur(10px)}}
@keyframes st-hl{from{transform:skewX(-14deg) scaleX(0)}}
.start.enter .field{animation:st-field 2s var(--ease-out) both}
.start.enter .mark path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw 700ms 200ms var(--ease-out) forwards}
.start.enter .mk-t>span{animation:st-ch 1s 300ms var(--ease-out) both}
.start.enter .mk-t>span+span{animation-delay:420ms}
.start.enter .mk-hl{animation:st-hl 560ms 950ms var(--ease-out) both}
.start.enter .cover-sub{animation:rise 800ms 1050ms var(--ease-out) both}
.start.enter .cover-go{animation:rise 800ms 1150ms var(--ease-out) both}
.start.enter .cover-more{animation:fade 800ms 1300ms both}
.start.enter .start-hint{animation:fade 1200ms 2200ms both}
/* 镜头：从开始页往里走（推近、散开），从里面回到开始页（拉远） */
@keyframes dive-out{to{opacity:0;transform:scale(1.08);filter:blur(6px)}}
@keyframes dive-in{from{opacity:0;transform:scale(.97)}}
@keyframes rise-out{to{opacity:0;transform:scale(.97)}}
@keyframes rise-in{from{opacity:0;transform:scale(1.06);filter:blur(4px)}}
html[data-vt=dive]::view-transition-old(main){animation:dive-out 520ms var(--ease-out) both}
html[data-vt=dive]::view-transition-new(main){animation:dive-in 600ms 100ms var(--ease-out) both}
html[data-vt=surface]::view-transition-old(main){animation:rise-out 360ms var(--ease-out) both}
html[data-vt=surface]::view-transition-new(main){animation:rise-in 700ms 60ms var(--ease-out) both}
/* 从复习包库点进一个复习包：那一叠最上面的一张纸展开成整页，标题飞到页头 */
::view-transition-group(pk-sheet),::view-transition-group(pk-title){animation-duration:560ms;animation-timing-function:var(--ease-out)}
::view-transition-group(pk-sheet){z-index:0}
::view-transition-group(main){z-index:1}
::view-transition-group(pk-title){z-index:2}

::view-transition-old(pk-sheet){animation:vt-out 200ms var(--ease-out) both}
::view-transition-new(pk-sheet){animation:none}
::view-transition-old(pk-title),::view-transition-new(pk-title){width:auto;height:100%;object-fit:fill}
::view-transition-old(pk-title){animation:vt-out 260ms var(--ease-out) both}
::view-transition-new(pk-title){animation:fade 360ms 120ms var(--ease-out) both}

/* 复习包库：每个复习包是桌面上的一叠讲义。材料越多叠得越厚，指上去最上面那张抬起来、底下几张散开 */
.shelfpage{max-width:76rem;margin-inline:auto;padding:var(--space-sm) var(--space-xl) var(--space-3xl)}

.lib-n{margin-bottom:.3rem;color:var(--color-muted);font-size:var(--text-lg)}

.shelf{margin-top:var(--space-xl)}
.shelf-h{display:flex;align-items:baseline;gap:var(--space-xs);margin:0 0 var(--space-md);color:var(--color-muted);font-size:var(--text-sm);font-weight:500}
.shelf-h .n{font-weight:400}
.stacks{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:var(--space-2xl) var(--space-xl);padding-bottom:var(--space-xs)}
.stack{position:relative;z-index:0;isolation:isolate;display:block;aspect-ratio:4/5;min-height:16rem;color:var(--color-ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
.stack .sb,.face{position:absolute;inset:0;border-radius:var(--radius-ctl);background:var(--color-sheet);box-shadow:var(--shadow-sheet);transition:transform 420ms var(--ease-out),box-shadow 420ms var(--ease-out)}
.stack .sb{background:var(--color-sheet-back)}
.stack .s1{z-index:-1;transform:translate(5px,6px) rotate(1.6deg)}
.stack .s2{z-index:-2;transform:translate(-4px,10px) rotate(-2deg)}
.stack .s3{z-index:-3;transform:translate(7px,14px) rotate(2.8deg)}
.stack:hover{z-index:1}
.stack:hover .face{transform:translateY(-6px);box-shadow:var(--shadow-lift)}
.stack:hover .s1{transform:translate(12px,3px) rotate(4deg)}
.stack:hover .s2{transform:translate(-11px,8px) rotate(-4.6deg)}
.stack:hover .s3{transform:translate(17px,13px) rotate(7deg)}
.stack:active .face{transform:translateY(-2px) scale(.99);transition-duration:var(--dur-micro)}
.stack:focus-visible{outline:2px solid var(--color-focus);outline-offset:6px;border-radius:var(--radius-ctl)}
.face{display:flex;flex-direction:column;padding:var(--space-lg) var(--space-lg) var(--space-md);overflow:hidden}
.face>*{flex-shrink:0}
.face-top{display:flex;align-items:center;justify-content:space-between;min-height:16px;color:var(--color-muted);font-size:var(--text-xs)}
.face-top svg{width:14px;height:14px;fill:currentColor;color:var(--color-ink)}
.face-t{margin-top:var(--space-lg);font-family:var(--font-display);font-size:1.4rem;font-weight:400;line-height:1.3;letter-spacing:.01em;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.face>.face-toc{flex-shrink:1;min-height:0;overflow:hidden}
.face-toc{list-style:none;margin:var(--space-md) 0 0;padding:0;color:var(--color-ink-2);font-size:var(--text-xs);line-height:1.45}
.face-toc li{display:flex;gap:var(--space-xs);padding:var(--space-2xs) 0;border-top:1px solid var(--color-rule)}
.face-toc .id{flex:none;width:1.7rem;color:var(--color-muted)}
.face-toc .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);margin-top:auto;padding-top:var(--space-md);color:var(--color-muted);font-size:var(--text-xs)}
.ticks{display:flex;flex-wrap:wrap;gap:var(--space-2xs);max-width:62%}
.ticks i{width:7px;height:7px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--color-rule-2)}
.ticks i.on{background:var(--color-ink);box-shadow:none}
.stack.old .face>*{opacity:.6}
.stack.sk .face{background:var(--color-sheet-back);box-shadow:none;animation:pulse .9s ease-in-out infinite alternate}
.lib-foot{display:flex;justify-content:center;margin-top:var(--space-2xl)}
.lib-foot .btn.quiet:hover{background:var(--color-desk-hover)}
.shelfpage .blank{margin-top:var(--space-xl);border-radius:var(--radius-box);background:var(--color-sheet);box-shadow:var(--shadow-sheet)}

}

  .stack .face{position:relative;min-height:12rem}
  .cover-sub{font-size:var(--text-md)}
  .layer.l-far .ln{font-size:11px}

}
@media print{
  .side,.mbar,.rbar,.rail,.toast,.net,.pop,.load,.edge{display:none!important}
  body{background:none}

</style>

<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="#/library" aria-label="温故，回到所有复习包">温故</a>
      <div class="side-head" id="sidehead"></div>
    </div>
    <nav class="lib" id="lib" aria-label="复习包"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <div class="main">
    <div class="mbar" id="mbar"></div>
    <main id="main"></main>
  </div>
</div>
<div class="load" id="load" aria-hidden="true"><i></i></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const $main = document.getElementById("main"), $lib = document.getElementById("lib"), $side = document.getElementById("side");
const WANT = "0.5.1";   // 和 wengu.py 的 VERSION 对齐：页面是每次现读的，程序要重新打开才换新，两边对不上就提示重开
const URL_RE = /https?:\/\/[^\s　，。！？、“”‘’（）()<>【】\[\]]+/g;
const ICON = {

  // 句子不是画好一张循环播放，而是边走边换：滚出画面的句子拿走，放回队尾；画面另一头要露出空位时，从队头挑一句还没在画面上的补进去。
  // 所以每句同一时刻最多出现一次，所有句子轮一遍才会再见到同一句，每次补的位置和间距也是随机的，不会出现一模一样的排版。
  // 同一层里分几列，每列上下按真实高度排，不会叠在一起
  const queue = [...lines], shown = new Set(), M = 90;
  for (let i = queue.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  const L = LAYERS.map(c => Object.assign({}, c, {el: h("div", {class: "layer " + c.cls}), y: 0, cols: [], turn: 0}));
  for (const c of L) field.append(c.el);   // 远的在下、近的在上
  let VH = 0;
  const pick = c => {   // 中层讲稿和名言轮流放；近层只放短句
    const ok = x => !shown.has(x) && wide(x) <= c.fit;
    let i = -1;
    if (c.cls === "l-mid"){ c.turn ^= 1; i = queue.findIndex(x => ok(x) && !!x.id === !!c.turn); }
    if (i < 0) i = queue.findIndex(ok);
    if (i < 0) return null;
    const x = queue.splice(i, 1)[0]; shown.add(x); return x;
  };
  const drop = it => { it.el.remove(); shown.delete(it.x); queue.push(it.x); };
  const spawn = (c, col, below) => {
    const x = pick(c); if (!x) return false;
    const el = item(x, col.w * .82); el.style.visibility = "hidden"; c.el.append(el);
    const hh = el.offsetHeight, ww = el.offsetWidth, gap = col.items.length ? c.gap * (.7 + Math.random() * .9) : 0;
    const top = below ? col.bot + gap : col.top - gap - hh, it = {x, el, top, bot: top + hh};
    el.style.left = (col.x + Math.random() * Math.max(0, col.w - ww - 12)).toFixed(0) + "px"; el.style.top = top.toFixed(0) + "px"; el.style.visibility = "";
    if (below) col.items.push(it); else col.items.unshift(it);
    if (below || col.items.length === 1) col.bot = it.bot;
    if (!below || col.items.length === 1) col.top = it.top;
    return true;
  };
  const fill = c => {
    const lo = c.y - M, hi = c.y + VH + M;
    for (const col of c.cols){
      let up = 0, down = 0;
      while (col.items.length && col.items[0].bot < lo){ drop(col.items.shift()); up = 1; }                       // 滚出上边
      while (col.items.length && col.items[col.items.length - 1].top > hi){ drop(col.items.pop()); down = 1; }   // 倒着滚，滚出下边
      if (col.items.length){ if (up) col.top = col.items[0].top; if (down) col.bot = col.items[col.items.length - 1].bot; }
      else if (up) col.top = col.bot = Math.max(col.bot, hi);      // 空了：下一句从画面外面进来，不在中间凭空冒出
      else if (down) col.top = col.bot = Math.min(col.top, lo);
      for (let n = 30; n-- && col.bot < hi;) if (!spawn(c, col, true)) col.bot += c.gap;      // 下面露出空位：补一句
      for (let n = 30; n-- && col.top > lo;) if (!spawn(c, col, false)) col.top -= c.gap;     // 倒着滚时上面露出空位
    }
  };
  const build = () => {   // 第一次和窗口大小变了：清空重排
    const W = field.clientWidth; VH = field.clientHeight;
    for (const c of L){
      for (const col of c.cols) col.items.forEach(drop);
      const n = Math.max(1, Math.round(W / c.colW)), cw = W / n;
      c.cols = Array.from({length: n}, (_, i) => { const v = c.y - M + Math.random() * c.gap; return {x: i * cw, w: cw, items: [], top: v, bot: v}; });
    }
    for (const c of [L[2], L[1], L[0]]) fill(c);   // 近层先挑短句
  };
  build();
  let raf = 0, last = performance.now(), vel = 0, mx = 0, my = 0, tx = 0, ty = 0, lastY = null;
  const paint = () => { for (const c of L) c.el.style.transform = `translate3d(${(-mx * c.par).toFixed(2)}px,${(-my * c.par - c.y).toFixed(2)}px,0)`; };
  const frame = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    vel *= Math.pow(.05, dt); mx += (tx - mx) * (1 - Math.pow(.004, dt)); my += (ty - my) * (1 - Math.pow(.004, dt));
    for (const c of L){ c.y += c.speed * (1 + vel) * dt; fill(c); }
    paint(); raf = requestAnimationFrame(frame);
  };
  const lit = el => {   // 荧光笔划过去，停一会儿再淡掉
    if (el._lit) return; el._lit = 1; el.classList.add("lit");
    setTimeout(() => el.classList.add("dim"), 1700);
    setTimeout(() => { el.classList.remove("lit", "dim"); el._lit = 0; }, 3300);
  };
  const root = field.parentElement;
  const on = [
    [root, "pointermove", e => { if (e.pointerType === "mouse"){ tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; } }],
    [field, "pointerover", e => { const el = e.target.closest(".ln"); if (el) lit(el); }],
    [root, "wheel", e => { e.preventDefault(); vel = Math.max(-40, Math.min(40, vel + e.deltaY * (e.deltaMode ? 1.2 : .045))); }, {passive: false}],
    [root, "touchstart", e => { lastY = e.touches[0].clientY; }, {passive: true}],
    [root, "touchmove", e => { const y = e.touches[0].clientY; if (lastY != null) vel = Math.max(-40, Math.min(40, vel + (lastY - y) * .5)); lastY = y; }, {passive: true}],
    [field, "click", () => vtMark("dive")],
    [window, "resize", () => { clearTimeout(build.t); build.t = setTimeout(() => { build(); paint(); }, 160); }]];
  for (const [t, ev, fn, o] of on) t.addEventListener(ev, fn, o);
  if (reduced.matches) paint(); else raf = requestAnimationFrame(frame);
  return () => { cancelAnimationFrame(raf); clearTimeout(build.t); for (const [t, ev, fn, o] of on) t.removeEventListener(ev, fn, o); };
}

/* ---------- 复习包库 ---------- */
let libSig = "";
function viewLibrary(){
  libSig = "";
  show([h("div", {class: "shelfpage"},
    h("header", {class: "lib-top"},
      h("a", {class: "brand", href: "#/", title: "回到开始页", onclick: () => vtMark("surface")}, "温故"),
      h("span", {class: "grow"}), h("div", {class: "row tight", id: "lib-tools"})),
    h("div", {class: "lib-head"},
      h("h1", {}, "所有复习包"), h("span", {class: "lib-n num", id: "lib-n"}), h("span", {class: "grow"}),
      h("div", {class: "search"}, icon("search"), h("input", {class: "in", type: "search", id: "lib-q", name: "q", autocomplete: "off", placeholder: "搜索复习包", "aria-label": "搜索复习包", value: prefs.q,
        oninput: e => { prefs.q = e.target.value.trim().toLowerCase(); paintLibrary(); }})),
      h("a", {class: "btn primary lg", href: "#/new"}, icon("plus"), "新建复习包")),
    h("div", {id: "lib-grid"}), h("div", {class: "lib-foot", id: "lib-foot"}))],
  () => { paintLibrary(); window.scrollTo(0, 0); });
}
function stackCard(p){
  const n = p.n_items, back = Math.min(3, Math.max(0, n - 1)), marks = (p.marks || "").slice(0, 30);
  return h("a", {class: "stack" + (p.archived ? " old" : ""), href: "#/pack/" + E(p.id),
      "aria-label": `${p.name}，${n} 份材料` + (p.n_review ? `，已写 ${p.n_review} 份复习文档` : "") + (p.archived ? "，已归档" : ""),
      onclick: e => {   // 这一张纸会展开成复习包页
        if (reduced.matches || !document.startViewTransition || e.metaKey || e.ctrlKey) return;
        morphId = p.id; vtMark("morph"); const a = e.currentTarget; a.querySelector(".face").style.viewTransitionName = "pk-sheet"; a.querySelector(".face-t").style.viewTransitionName = "pk-title";
      }},
    Array.from({length: back}, (_, i) => h("i", {class: "sb s" + (i + 1)})),
    h("div", {class: "face"},
      h("div", {class: "face-top"}, h("span", {}, fmtDate(p.created)), p.pinned ? icon("star") : null),
      h("h3", {class: "face-t"}, p.name),
      (p.peek || []).length ? h("ol", {class: "face-toc"}, p.peek.map(([sid, t]) => h("li", {}, h("span", {class: "id num"}, sid), h("span", {class: "t"}, t)))) : null,
      h("div", {class: "face-foot"},
        marks ? h("span", {class: "ticks", "aria-hidden": "true", title: "实心的是已经写了复习文档的材料"}, [...marks].map(c => h("i", {class: c === "1" ? "on" : null}))) : h("span", {}),
        h("span", {class: "num"}, p.archived ? "已归档" : p.n_review ? `已写 ${p.n_review} / ${n}` : `${n} 份材料`))));
}
function paintLibrary(){
  const grid = document.getElementById("lib-grid"); if (!grid) return;
  const q = prefs.q, archived = S.packs.filter(p => p.archived);
  const sig = JSON.stringify([booted, q, prefs.showArchived, S.packs, S.trash]);
  if (sig === libSig) return; libSig = sig;
  put(document.getElementById("lib-tools"),
    S.trash ? h("a", {class: "btn quiet", href: "#/trash", title: "删掉的复习包在这里放 7 天"}, icon("trash"), `废纸篓 ${S.trash}`) : null,
    btn("", "text", {class: "btn quiet icon", "aria-label": "显示设置", title: "显示设置", onclick: e => displayPop(e.currentTarget, false)}),
    btn("退出", "power", {class: "btn quiet", onclick: quit}));
  const live = S.packs.filter(p => !p.archived).length;
  document.getElementById("lib-n").textContent = booted && live ? String(live) : "";
  if (!booted){ put(grid, h("div", {class: "stacks", "aria-busy": "true"}, [0, 1, 2].map(() => h("div", {class: "stack sk"}, h("div", {class: "face"}))))); return; }
  let list = S.packs.filter(p => prefs.showArchived || q ? true : !p.archived);
  if (q) list = list.filter(p => (p.name + " " + p.group).toLowerCase().includes(q));
  const groups = groupPacks(list), solo = groups.size === 1 && groups.has("全部");
  put(grid, !list.length
    ? h("div", {class: "blank"}, q ? [h("h2", {}, "没有叫这个名字的复习包"), h("p", {}, "换个关键词试试，分组名也能搜")]
      : [h("h2", {}, "还没有复习包"), h("p", {}, "点右上角「新建复习包」，把课程视频、PPT 或 PDF 交给温故。提取完的复习包会一叠一叠放在这里。")])
    : [...groups].map(([g, ps]) => h("section", {class: "shelf", "aria-label": solo ? "复习包" : g},
        solo ? null : h("h2", {class: "shelf-h"}, g, h("span", {class: "n num"}, ps.length)),
        h("div", {class: "stacks"}, ps.map(stackCard)))));
  put(document.getElementById("lib-foot"), archived.length && !q ? btn(prefs.showArchived ? "隐藏已归档" : `显示已归档的 ${archived.length} 个`, "archive",
    {class: "btn quiet", onclick: () => { prefs.showArchived = !prefs.showArchived; paintLibrary(); }}) : null);
}

/* ---------- 路由与轮询 ---------- */
function goHome(){ location.replace("#/library"); }
function render(){
  navToken++; closePop(); editing = false; loading(false);
  if (readCleanup){ readCleanup(); readCleanup = null; }
  const r = route();
  if (!$main.firstChild) document.body.dataset.view = r.view;   // 第一次打开：外框先到位；之后跟着新页面一起换
  if (stale){ renderSide(); show([h("div", {class: "page narrow"}, h("div", {class: "blank"}, h("h2", {}, "温故更新过了，要重新打开一次"),
    h("p", {}, "页面已经是新的，正在运行的还是更新前启动的那一次。先退出，再点「温故」图标打开，复习包都还在。"), btn("退出温故", "power", {class: "btn primary lg", onclick: quit})))]); return; }
  if (r.view !== "read" && r.view !== "doc") viewRead.shown = null;
  renderSide();
  if (r.view === "pack") viewPack(r.id);
  else if (r.view === "read" || r.view === "doc") viewRead(r);
  else if (r.view === "new") viewNew();
  else if (r.view === "trash") viewTrash();
  else if (r.view === "library") viewLibrary();
  else viewStart();
}
async function poll(){
  if (pollTimer === "stopped") return;
  clearTimeout(pollTimer);
  const tok = navToken, r = route();
  try {
    S = await api("/api/state"); online = true;
    const was = stale; booted = true; stale = !!S.version && S.version !== WANT;
    if (stale !== was){ render(); }
    if (stale) throw 0;
    const j = S.job, fresh = j && j.status === "done" && j.pack && prefs.jobSeen !== j.id;
    if (fresh){ prefs.jobSeen = j.id; sessionStorage.setItem("wg_job", j.id); }
    if (fresh && r.view === "new") location.hash = "#/pack/" + E(j.pack);   // 提取刚完成：直接进复习包
    else {
      renderSide();
      if (tok === navToken && r.view === "new") paintNew();
      if (tok === navToken && r.view === "start") paintStartMeta();
      if (tok === navToken && r.view === "library") paintLibrary();
      if (tok === navToken && r.view === "pack"){
        const p = await getPack(r.id);
        if (tok === navToken && JSON.stringify(p) !== viewPack.last){ viewPack.last = JSON.stringify(p); packCache[r.id] = p; paintPack(p); }
      }
      if (tok === navToken && (r.view === "read" || r.view === "doc") && packCache[r.id]){   // AI 刚写好的文档：目录和当前页自己更新
        const p = await getPack(r.id), sh = viewRead.shown;
        if (tok === navToken){ packCache[r.id] = p; renderSide();
          const now = sh && sh.sid && p.items.find(i => i.sid === sh.sid);
          if (now && JSON.stringify(now) !== sh.sig) viewRead(r); }
      }
    }
  } catch (e) {
    if (e !== 0 && !e.status) online = false;
    else if (e.status === 404 && tok === navToken && ["pack", "read", "doc"].includes(r.view)) goHome();
  }
  let nb = document.getElementById("net");
  if (online) nb?.remove();
  else if (!nb) document.body.append(h("p", {class: "banner net", id: "net", role: "alert"}, "连不上温故，它可能已经退出了。点「温故」图标重新打开，这个页面会自己恢复。"));
  if (pollTimer !== "stopped") pollTimer = setTimeout(poll, S.job?.status === "running" ? 1200 : 4000);
}
window.addEventListener("hashchange", render);
applyPrefs(); setupSide(); render(); poll();
